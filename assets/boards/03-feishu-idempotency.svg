<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">source_url 是飞书回写的幂等键</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">规范化的来源 URL 作为稳定 ID，重跑不重复</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><text x="96" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="650" letter-spacing="1.5" fill="#8A8A8A">03 / PUBLISH</text><circle cx="250" cy="380" r="74" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/><circle cx="250" cy="306" r="8" fill="#2F6BFF"/><text x="250" y="376" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18px" font-weight="650" fill="#111111">source_url</text><text x="250" y="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13px" font-weight="400" fill="#666666">规范化</text><line x1="324" y1="380" x2="452" y2="380" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="452" y="324" width="240" height="112" rx="0" fill="#F5F5F5" stroke="#222222" stroke-width="1.5"/><text x="572" y="378" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">创建 / 更新</text><text x="572" y="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">按 URL 匹配</text><line x1="692" y1="380" x2="760" y2="380" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="760"